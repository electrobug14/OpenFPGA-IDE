[package]
name = "openfpga-ide"
version = "1.0.0"
description = "OpenFPGA IDE — open-source EDA toolchain GUI"
authors = ["OpenFPGA IDE"]
edition = "2021"

[lib]
name = "openfpga_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openfpga-ide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
